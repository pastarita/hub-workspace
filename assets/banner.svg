<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="hub-workspace: hub, shell, model, viewer, diagrams, gate, rails, lints">
  <defs>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .t{fill:#1a1a1a;font-size:13px}
      .m{fill:#6b6b6b;font-size:11px}
      .w{fill:#1a1a1a;font-size:64px;font-weight:700;letter-spacing:-0.02em}
      .s{fill:#8a8a8a;font-size:11.5px;letter-spacing:.18em}
      .ln{stroke:#9a9a9a;stroke-width:1;fill:none}
      .ld{stroke:#9a9a9a;stroke-width:1;fill:none;stroke-dasharray:4 4}
      .bx{fill:#fff;stroke:#1a1a1a;stroke-width:1.4}
      .bg{fill:#f4f4f4;stroke:#cfcfcf;stroke-width:1}
    </style>
  </defs>
  <rect width="1200" height="420" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1199" height="419" fill="none" stroke="#1a1a1a"/>

  <!-- monogram: the hub glyph — a rail, an index of cards -->
  <g transform="translate(60,70)">
    <rect x="0" y="0" width="200" height="220" class="bx" rx="6"/>
    <rect x="0" y="0" width="44" height="220" fill="#1a1a1a" rx="6"/>
    <rect x="38" y="0" width="6" height="220" fill="#1a1a1a"/>
    <g fill="#ffffff">
      <rect x="12" y="18" width="20" height="3"/><rect x="12" y="30" width="14" height="3"/>
      <rect x="12" y="58" width="20" height="3"/><rect x="12" y="70" width="14" height="3"/><rect x="12" y="82" width="14" height="3"/>
      <rect x="12" y="110" width="20" height="3"/><rect x="12" y="122" width="14" height="3"/>
      <rect x="12" y="150" width="20" height="3"/><rect x="12" y="162" width="14" height="3"/><rect x="12" y="174" width="14" height="3"/>
    </g>
    <g class="bx">
      <rect x="62" y="22" width="56" height="40" rx="4"/><rect x="128" y="22" width="56" height="40" rx="4"/>
      <rect x="62" y="74" width="56" height="40" rx="4"/><rect x="128" y="74" width="56" height="40" rx="4"/>
      <rect x="62" y="138" width="122" height="60" rx="4"/>
    </g>
    <g fill="#1a1a1a">
      <rect x="70" y="30" width="14" height="14" rx="2"/><rect x="136" y="30" width="14" height="14" rx="2"/>
      <rect x="70" y="82" width="14" height="14" rx="2"/><rect x="136" y="82" width="14" height="14" rx="2"/>
    </g>
    <g stroke="#1a1a1a" stroke-width="1.2" fill="none">
      <path d="M72 158 h24 v8 h-24 z"/><path d="M104 162 h14"/><path d="M118 162 l16 0"/><path d="M134 158 h24 v8 h-24 z"/>
      <path d="M96 176 v10 h40 v-10" stroke-dasharray="2 2"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="300" y="118" class="mono w">hub-workspace</text>
  <text x="302" y="146" class="mono s">A SKILL FOR CODING AGENTS · FLAT HTML · ONE FILE PER ARTIFACT</text>
  <text x="302" y="176" class="mono t">A project site humans and agents co-author safely: drafts local, main is live, everything behind a gate.</text>

  <!-- the feature constellation -->
  <g class="mono">
    <!-- nodes -->
    <g>
      <rect x="300" y="228" width="92" height="30" class="bx" rx="15"/><text x="346" y="247" class="t" text-anchor="middle">Hub</text>
      <rect x="430" y="228" width="92" height="30" class="bx" rx="15"/><text x="476" y="247" class="t" text-anchor="middle">Shell</text>
      <rect x="560" y="228" width="92" height="30" class="bx" rx="15"/><text x="606" y="247" class="t" text-anchor="middle">Model</text>
      <rect x="690" y="228" width="92" height="30" class="bx" rx="15"/><text x="736" y="247" class="t" text-anchor="middle">Viewer</text>
      <rect x="820" y="228" width="110" height="30" class="bx" rx="15"/><text x="875" y="247" class="t" text-anchor="middle">Diagrams</text>

      <rect x="365" y="318" width="92" height="30" class="bx" rx="4"/><text x="411" y="337" class="t" text-anchor="middle">Gate</text>
      <rect x="560" y="318" width="92" height="30" class="bx" rx="4"/><text x="606" y="337" class="t" text-anchor="middle">Lints</text>
      <rect x="755" y="318" width="92" height="30" class="bx" rx="4"/><text x="801" y="337" class="t" text-anchor="middle">Rails</text>
    </g>
    <!-- edges -->
    <path d="M392 243 H430" class="ln"/><path d="M522 243 H560" class="ln"/><path d="M652 243 H690" class="ln"/><path d="M782 243 H820" class="ln"/>
    <path d="M346 258 C346 300 411 290 411 318" class="ld"/>
    <path d="M476 258 C476 300 411 290 411 318" class="ld"/>
    <path d="M606 258 V318" class="ld"/>
    <path d="M736 258 C736 300 801 290 801 318" class="ld"/>
    <path d="M875 258 C875 300 801 290 801 318" class="ld"/>
    <path d="M457 333 H560" class="ln"/><path d="M652 333 H755" class="ln"/>
    <!-- captions -->
    <text x="346" y="278" class="m" text-anchor="middle">grouped index, cards only</text>
    <text x="476" y="278" class="m" text-anchor="middle">one sidebar, one registry</text>
    <text x="606" y="278" class="m" text-anchor="middle">one data layer, tokens once</text>
    <text x="736" y="278" class="m" text-anchor="middle">.md .csv .json in the shell</text>
    <text x="875" y="278" class="m" text-anchor="middle">mermaid → SVG, own tokens</text>
    <text x="411" y="368" class="m" text-anchor="middle">Cloudflare Access · PIN · two doors</text>
    <text x="606" y="368" class="m" text-anchor="middle">nav · links · diagrams · provenance</text>
    <text x="801" y="368" class="m" text-anchor="middle">push → deploy · preview per PR</text>
  </g>

  <!-- right margin: the three moves -->
  <g class="mono" transform="translate(985,222)">
    <text x="0" y="0" class="s">THE THREE MOVES</text>
    <text x="0" y="26" class="t">1  write the leaf</text>
    <text x="0" y="48" class="t">2  register it</text>
    <text x="0" y="70" class="t">3  card the hub</text>
    <text x="0" y="98" class="m">a fourth move means</text>
    <text x="0" y="114" class="m">the pattern is being broken</text>
    <path d="M0 132 h180" class="ln"/>
    <text x="0" y="152" class="m">DERIVED · AUTHORED · TO CONFIRM</text>
  </g>

  <text x="60" y="392" class="mono m">github.com/pastarita/hub-workspace · MIT · exemplar: exemplars/3pt-hub</text>
</svg>
