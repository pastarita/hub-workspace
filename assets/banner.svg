<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="hub-workspace: hub, shell, model, viewer, diagrams, gate, rails, lints">
  <defs>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .t{fill:#1a1a1a;font-size:13px}
      .m{fill:#6b6b6b;font-size:11px}
      .w{fill:#1a1a1a;font-size:64px;font-weight:700;letter-spacing:-0.02em}
      .s{fill:#8a8a8a;font-size:11.5px;letter-spacing:.18em}
      .ln{stroke:#9a9a9a;stroke-width:1;fill:none}
      .ld{stroke:#9a9a9a;stroke-width:1;fill:none;stroke-dasharray:4 4}
      .br{stroke:#1a1a1a;stroke-width:1.2;fill:none}
      .bx{fill:#fff;stroke:#1a1a1a;stroke-width:1.4}
      .bg{fill:#f4f4f4;stroke:#cfcfcf;stroke-width:1}
    </style>
  </defs>
  <rect width="1200" height="460" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1199" height="459" fill="none" stroke="#1a1a1a"/>

  <!-- monogram: the hub glyph — a rail, an index of cards -->
  <g transform="translate(60,70)">
    <rect x="0" y="0" width="200" height="220" class="bx" rx="6"/>
    <rect x="0" y="0" width="44" height="220" fill="#1a1a1a" rx="6"/>
    <rect x="38" y="0" width="6" height="220" fill="#1a1a1a"/>
    <g fill="#ffffff">
      <rect x="12" y="18" width="20" height="3"/><rect x="12" y="30" width="14" height="3"/>
      <rect x="12" y="58" width="20" height="3"/><rect x="12" y="70" width="14" height="3"/><rect x="12" y="82" width="14" height="3"/>
      <rect x="12" y="110" width="20" height="3"/><rect x="12" y="122" width="14" height="3"/>
      <rect x="12" y="150" width="20" height="3"/><rect x="12" y="162" width="14" height="3"/><rect x="12" y="174" width="14" height="3"/>
    </g>
    <g class="bx">
      <rect x="62" y="22" width="56" height="40" rx="4"/><rect x="128" y="22" width="56" height="40" rx="4"/>
      <rect x="62" y="74" width="56" height="40" rx="4"/><rect x="128" y="74" width="56" height="40" rx="4"/>
      <rect x="62" y="138" width="122" height="60" rx="4"/>
    </g>
    <g fill="#1a1a1a">
      <rect x="70" y="30" width="14" height="14" rx="2"/><rect x="136" y="30" width="14" height="14" rx="2"/>
      <rect x="70" y="82" width="14" height="14" rx="2"/><rect x="136" y="82" width="14" height="14" rx="2"/>
    </g>
    <g stroke="#1a1a1a" stroke-width="1.2" fill="none">
      <path d="M72 156 h24 v12 h-24 z"/><path d="M134 156 h24 v12 h-24 z"/>
      <path d="M96 162 H134"/>
      <path d="M84 168 v12 h62 v-12" stroke-dasharray="2 2"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="300" y="118" class="mono w">hub-workspace</text>
  <text x="302" y="146" class="mono s">A SKILL FOR CODING AGENTS · FLAT HTML · ONE FILE PER ARTIFACT</text>
  <text x="302" y="176" class="mono t">A project site humans and agents co-author safely: drafts local, main is live, everything behind a gate.</text>

  <!-- the feature constellation: the site (a connected chain) over the three things that
       apply to all of it (hung from one bracket). No edge crosses a caption. -->
  <g class="mono">
    <rect x="300" y="222" width="104" height="30" class="bx" rx="15"/><text x="352" y="241" class="t" text-anchor="middle">Hub</text>
    <text x="352" y="272" class="m" text-anchor="middle">grouped index</text><text x="352" y="286" class="m" text-anchor="middle">cards only</text>
    <path d="M404 237 H434" class="ln"/>
    <rect x="434" y="222" width="104" height="30" class="bx" rx="15"/><text x="486" y="241" class="t" text-anchor="middle">Shell</text>
    <text x="486" y="272" class="m" text-anchor="middle">one sidebar</text><text x="486" y="286" class="m" text-anchor="middle">one registry</text>
    <path d="M538 237 H568" class="ln"/>
    <rect x="568" y="222" width="104" height="30" class="bx" rx="15"/><text x="620" y="241" class="t" text-anchor="middle">Model</text>
    <text x="620" y="272" class="m" text-anchor="middle">one data layer</text><text x="620" y="286" class="m" text-anchor="middle">tokens once</text>
    <path d="M672 237 H702" class="ln"/>
    <rect x="702" y="222" width="104" height="30" class="bx" rx="15"/><text x="754" y="241" class="t" text-anchor="middle">Viewer</text>
    <text x="754" y="272" class="m" text-anchor="middle">.md .csv .json</text><text x="754" y="286" class="m" text-anchor="middle">in the Shell</text>
    <path d="M806 237 H836" class="ln"/>
    <rect x="836" y="222" width="104" height="30" class="bx" rx="15"/><text x="888" y="241" class="t" text-anchor="middle">Diagrams</text>
    <text x="888" y="272" class="m" text-anchor="middle">mermaid → SVG</text><text x="888" y="286" class="m" text-anchor="middle">in own tokens</text>
    <!-- the bracket: everything above sits behind the gate, under the lints, on the rails -->
    <path d="M300 298 V306 H940 V298" class="br"/>
    <path d="M380 306 V328" class="br"/>
    <rect x="320" y="328" width="120" height="30" class="bx" rx="4"/><text x="380" y="347" class="t" text-anchor="middle">Gate</text>
    <text x="380" y="378" class="m" text-anchor="middle">Cloudflare Access</text><text x="380" y="392" class="m" text-anchor="middle">one-time PIN · two doors</text>
    <path d="M620 306 V328" class="br"/>
    <rect x="560" y="328" width="120" height="30" class="bx" rx="4"/><text x="620" y="347" class="t" text-anchor="middle">Lints</text>
    <text x="620" y="378" class="m" text-anchor="middle">nav · links · diagrams</text><text x="620" y="392" class="m" text-anchor="middle">provenance</text>
    <path d="M860 306 V328" class="br"/>
    <rect x="800" y="328" width="120" height="30" class="bx" rx="4"/><text x="860" y="347" class="t" text-anchor="middle">Rails</text>
    <text x="860" y="378" class="m" text-anchor="middle">push → deploy</text><text x="860" y="392" class="m" text-anchor="middle">preview per PR</text>
  </g>

  <!-- right margin: the three moves -->
  <g class="mono" transform="translate(972,222)">
    <text x="0" y="0" class="s">THE THREE MOVES</text>
    <text x="0" y="26" class="t">1  write the leaf</text>
    <text x="0" y="48" class="t">2  register it</text>
    <text x="0" y="70" class="t">3  card the hub</text>
    <text x="0" y="98" class="m">a fourth move means</text>
    <text x="0" y="114" class="m">the pattern is being broken</text>
    <path d="M0 132 h180" class="ln"/>
    <text x="0" y="152" class="m">DERIVED · AUTHORED · TO CONFIRM</text>
  </g>

  <text x="60" y="432" class="mono m">github.com/pastarita/hub-workspace · MIT · exemplar: exemplars/reference-hub</text>
</svg>
