# hub-workspace reference · CI/CD (Cloudflare Pages).
#
# TEMPLATE: GitHub only runs workflows from the repository root's .github/workflows/. Copy this
# file there in a real hub and set WORKDIR to the hub's directory ('.' when the hub is the repo).
#
# push to main  → stage + lints → production deploy  (https://<project>.pages.dev, gated)
# pull request  → stage + lints → preview deploy at https://<branch>.<project>.pages.dev
#                 + one sticky PR comment with the URL, so the other principal reviews in the browser.
#
# Deploy steps no-op with a notice until the two repository secrets exist:
#   gh secret set CLOUDFLARE_API_TOKEN   (token scope: Cloudflare Pages: Edit)
#   gh secret set CLOUDFLARE_ACCOUNT_ID  (from `npx wrangler whoami`)
# wrangler runs from the hub directory so functions/_middleware.js (the gate) is compiled.
name: Deploy hub to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

env:
  WORKDIR: exemplars/reference-hub

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write

defaults:
  run:
    working-directory: exemplars/reference-hub   # keep equal to WORKDIR (contexts are not allowed here)

jobs:
  check:
    name: Stage + lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: bash tools/stage.sh
      - run: node tools/check-nav.mjs
      - run: node tools/check-view.mjs
      - run: node tools/check-diagram.mjs

  deploy:
    name: Deploy
    needs: check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/stage.sh
      - name: Check deploy credentials
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then echo "ok=true" >> "$GITHUB_OUTPUT";
          else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::Cloudflare secrets not set — deploy skipped (deploy by hand: make deploy)"; fi
      - name: Deploy to Pages
        id: deploy
        if: steps.creds.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ env.WORKDIR }}
          # PRs deploy to a preview URL; main deploys production. One expression, both environments.
          command: pages deploy _site --project-name=hub-workspace --branch=${{ github.head_ref || 'main' }}
      - name: Comment preview on PR
        if: steps.creds.outputs.ok == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        with:
          script: |
            const marker = '<!-- hub-preview -->';
            const body = [marker, '## Hub preview', '', '| | |', '|---|---|',
              `| Preview | ${process.env.DEPLOY_URL} |`,
              `| Branch alias | ${process.env.ALIAS_URL || '—'} |`,
              `| Commit | \`${context.payload.pull_request.head.sha.slice(0, 7)}\` |`, '',
              '_Gated at the edge — sign in through Cloudflare Access (one-time PIN)._'].join('\n');
            const { data: comments } = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
